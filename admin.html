<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Bouras.shop_dz | لوحة الإدارة
</title>


<link rel="stylesheet" href="css/admin.css">


<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">


</head>


<body>


<header class="admin-header">

<div>

<h1>
⚙️ لوحة إدارة Bouras.shop_dz
</h1>

<p>
إدارة المنتجات بسهولة
</p>

</div>


<a href="index.html">
العودة للمتجر 🛒
</a>


</header>





<main class="dashboard">



<section class="stats">


<div class="stat-card">

<h2 id="productCount">
0
</h2>

<p>
عدد المنتجات
</p>

</div>



<div class="stat-card">

<h2>
DZ
</h2>

<p>
متجر الجزائر
</p>

</div>



<div class="stat-card">

<h2>
✔
</h2>

<p>
النظام يعمل
</p>

</div>



</section>






<section class="add-box">


<h2>
➕ إضافة منتج جديد
</h2>



<div class="form-grid">



<input 
id="productName"
placeholder="اسم المنتج">



<input 
id="productPrice"
type="number"
placeholder="السعر">



<select id="productCategory">


<option>
اختر القسم
</option>

<option>
ملابس
</option>

<option>
أحذية
</option>

<option>
إكسسوارات
</option>

<option>
عطور
</option>

<option>
تجميل
</option>

<option>
ألعاب
</option>


</select>




<input
id="productImage"
placeholder="رابط صورة المنتج">



</div>



<div class="preview">


<img id="imagePreview"
src="assets/images/default.png">


</div>



<button onclick="addProduct()">

حفظ المنتج ✅

</button>



</section>






<section class="products-area">


<h2>
📦 المنتجات
</h2>


<div id="adminProducts"
class="products-grid">

</div>


</section>



</main>




<script>


const imageInput =
document.getElementById("productImage");


const preview =
document.getElementById("imagePreview");



imageInput.addEventListener(
"input",
()=>{


preview.src =
imageInput.value ||
"assets/images/default.png";


}

);


</script>



<script src="js/admin.js"></script>


</body>

</html>
